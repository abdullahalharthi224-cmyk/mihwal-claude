name: Mihwal

options:
  bundleIdPrefix: com.abdullah
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""

targets:
  Mihwal:
    type: application
    platform: iOS
    sources:
      - path: Mihwal
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: "مِحوَل C"
        CFBundleDevelopmentRegion: "$(DEVELOPMENT_LANGUAGE)"
        CFBundleLocalizations: [ar, en]
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # "Open in Mihwal" / Share sheet: iOS gives us a copy in Documents/Inbox.
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
          - CFBundleTypeName: Image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.image]
          - CFBundleTypeName: Plain Text
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.plain-text]
        NSPhotoLibraryAddUsageDescription: "Mihwal saves the images you create to your photo library."
    settings:
      base:
        PRODUCT_NAME: Mihwal
        PRODUCT_BUNDLE_IDENTIFIER: com.abdullah.mihwal.claude
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES

  MihwalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MihwalTests
    dependencies:
      - target: Mihwal
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.abdullah.mihwal.claude.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Mihwal.app/Mihwal"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Mihwal:
    build:
      targets:
        Mihwal: all
        MihwalTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MihwalTests
    archive:
      config: Release
