name: Build IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write   # needed to publish the IPA as a GitHub Release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use the latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Guard — no network code in the app
        run: |
          if grep -rnE "URLSession|URLRequest|NWConnection|WKWebView" Mihwal; then
            echo "::error::Mihwal must not contain any networking code."
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick an iPhone simulator
        id: sim
        run: |
          SIM_ID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              if "iOS" not in runtime:
                  continue
              for d in devices[runtime]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit(0)
          sys.exit("No iPhone simulator found")
          ')
          echo "Using simulator $SIM_ID"
          echo "id=$SIM_ID" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Mihwal.xcodeproj \
            -scheme Mihwal \
            -destination "id=${{ steps.sim.outputs.id }}" \
            -derivedDataPath build/test \
            -quiet

      - name: Build Release for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Mihwal.xcodeproj \
            -scheme Mihwal \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet

      - name: Package unsigned IPA
        run: |
          APP=build/device/Build/Products/Release-iphoneos/Mihwal.app
          test -d "$APP" || { echo "::error::Mihwal.app was not produced"; exit 1; }
          ls "$APP" | grep -q "ar.lproj" || echo "::warning::ar.lproj is missing from the app"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/Info.plist")
          echo "Bundle id: $BUNDLE_ID"
          test "$BUNDLE_ID" = "com.abdullah.mihwal.claude" || { echo "::error::Unexpected bundle id $BUNDLE_ID"; exit 1; }
          echo "Name under the icon:"
          for LANG_DIR in ar en; do
            echo "  $LANG_DIR: $(plutil -extract CFBundleDisplayName raw "$APP/$LANG_DIR.lproj/InfoPlist.strings" 2>/dev/null || echo missing)"
          done
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Mihwal.ipa Payload
          ls -lh Mihwal.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Mihwal-ipa
          path: Mihwal.ipa
          if-no-files-found: error
          retention-days: 30

      # A direct .ipa download link (no zip): every green build on main becomes the
      # "latest" release, so this URL always serves the newest build:
      # https://github.com/<owner>/<repo>/releases/latest/download/Mihwal.ipa
      - name: Publish IPA as the latest release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Mihwal build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: Mihwal.ipa
          body: |
            Unsigned IPA for sideloading. Bundle id `com.abdullah.mihwal.claude`.
            Commit: ${{ github.sha }}
