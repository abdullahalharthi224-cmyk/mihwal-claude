name: Build IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use the latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Guard — no network code in the app
        run: |
          if grep -rnE "URLSession|URLRequest|NWConnection|WKWebView" Mihwal; then
            echo "::error::Mihwal must not contain any networking code."
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick an iPhone simulator
        id: sim
        run: |
          SIM_ID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              if "iOS" not in runtime:
                  continue
              for d in devices[runtime]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit(0)
          sys.exit("No iPhone simulator found")
          ')
          echo "Using simulator $SIM_ID"
          echo "id=$SIM_ID" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Mihwal.xcodeproj \
            -scheme Mihwal \
            -destination "id=${{ steps.sim.outputs.id }}" \
            -derivedDataPath build/test \
            -quiet

      - name: Build Release for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Mihwal.xcodeproj \
            -scheme Mihwal \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet

      - name: Package unsigned IPA
        run: |
          APP=build/device/Build/Products/Release-iphoneos/Mihwal.app
          test -d "$APP" || { echo "::error::Mihwal.app was not produced"; exit 1; }
          ls "$APP" | grep -q "ar.lproj" || echo "::warning::ar.lproj is missing from the app"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Mihwal.ipa Payload
          ls -lh Mihwal.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Mihwal-ipa
          path: Mihwal.ipa
          if-no-files-found: error
          retention-days: 30
